name: roswapd

on:
  push:
    branches: [ "master" ]
    paths: &paths
      - 'src/**'
      - 'proto/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/e2e/setup-rxe.sh'
      - '.github/workflows/rust.yml'
      - '.github/scripts/apt-install.sh'
      - '.github/scripts/setup-soft-roce.sh'
  pull_request:
    branches: [ "master" ]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Format
      run: cargo fmt --check

    - name: Install RDMA libraries
      run: bash .github/scripts/apt-install.sh libibverbs-dev librdmacm-dev protobuf-compiler

    - uses: Swatinem/rust-cache@v2

    - name: Clippy
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Setup Soft-RoCE
      run: bash .github/scripts/setup-soft-roce.sh

    - name: Run tests
      run: cargo test --locked -- --test-threads=1
