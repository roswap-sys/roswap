name: roswap.ko

on:
  push:
    branches: [ "master" ]
    paths:
      - 'kernel/**'
      - 'src/**'
      - 'proto/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/kernel.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'kernel/**'
      - 'src/**'
      - 'proto/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/kernel.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install kernel headers and build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          kmod \
          linux-headers-$(uname -r)

    - name: Build kernel module and blkcheck tool
      run: |
        uname -a
        make -C kernel
        modinfo kernel/roswap.ko
        gcc -O2 -Wall -Wextra tools/blkcheck.c -o tools/blkcheck
        gcc -O2 -Wall -Wextra tools/memhold.c -o tools/memhold

    - name: Load, verify, and unload roswap.ko
      run: |
        sudo insmod kernel/roswap.ko
        sudo udevadm settle
        ls -l /dev/roswap0
        cat /sys/block/roswap0/size
        test ! -e /sys/module/roswap/parameters/rkey
        sudo rmmod roswap
        sudo dmesg | tail -n 20

    - name: Install RDMA userspace and Rust
      run: |
        sudo apt-get install -y \
          libibverbs-dev \
          librdmacm-dev \
          rdma-core \
          ibverbs-providers \
          ibverbs-utils \
          iproute2 \
          protobuf-compiler \
          util-linux
    - uses: dtolnay/rust-toolchain@stable

    - name: Soft-RoCE datapath
      run: |
        set -euo pipefail
        sudo modprobe rdma_rxe || sudo modprobe siw
        sudo modprobe rdma_ucm || true
        NETDEV=$(ip -o -4 route show to default | awk '{print $5}' | head -n1)
        sudo rdma link add rxe0 type rxe netdev "$NETDEV" || sudo rdma link add siw0 type siw netdev "$NETDEV"
        rdma link show
        cargo build --release --bin roswapd
        cat > /tmp/roswap-ci.toml <<'EOF'
        role = "provider"

        [provider]
        device_name = ""
        listen_addr = "0.0.0.0:18516"
        grpc_addr = "127.0.0.1:12221"
        mem_dir = "/dev/shm/roswap-ci"
        chunk_size_mb = 64
        num_chunks = 1
        node_epoch = 1
        EOF
        cleanup() {
          sudo swapoff /dev/roswap0 >/dev/null 2>&1 || true
          sudo umount /mnt/roswap-huge >/dev/null 2>&1 || true
          sudo rmmod roswap >/dev/null 2>&1 || true
          if [ -n "${ROS_PID:-}" ] && kill -0 "$ROS_PID" >/dev/null 2>&1; then
            kill "$ROS_PID" >/dev/null 2>&1 || true
            wait "$ROS_PID" >/dev/null 2>&1 || true
          fi
        }
        trap cleanup EXIT
        load_roswap() {
          local log=$1
          local line raddr rkey listen
          line=$(grep "chunk registered" "$log" | head -n1)
          raddr=$(printf '%s\n' "$line" | sed -n 's/.*raddr=\(0x[0-9a-fA-F]*\).*/\1/p')
          rkey=$(printf '%s\n' "$line" | sed -n 's/.*rkey=\(0x[0-9a-fA-F]*\).*/\1/p')
          listen=$(sed -n 's/.*listen=\([0-9.]*:[0-9]*\).*/\1/p' "$log" | head -n1)
          test -n "$raddr" && test -n "$rkey" && test -n "$listen"
          sudo insmod kernel/roswap.ko server="$listen" raddr="$raddr" rkey="$rkey" chunk_size_mb=64
          sudo udevadm settle
        }
        start_provider() {
          local log=$1
          : > "$log"
          ./target/release/roswapd /tmp/roswap-ci.toml > "$log" 2>&1 &
          ROS_PID=$!
          for _ in $(seq 1 50); do
            if grep -q "chunk registered" "$log"; then
              return 0
            fi
            sleep 0.2
          done
          echo "provider did not register a chunk" >&2
          cat "$log" >&2
          return 1
        }
        stop_provider() {
          if [ -n "${ROS_PID:-}" ] && kill -0 "$ROS_PID" >/dev/null 2>&1; then
            kill "$ROS_PID" >/dev/null 2>&1 || true
            wait "$ROS_PID" >/dev/null 2>&1 || true
          fi
          ROS_PID=
        }
        expect_io_fails_quickly() {
          local limit=$1
          local start end rc
          start=$(date +%s)
          set +e
          timeout "$limit" sudo dd if=/dev/roswap0 of=/dev/null bs=4096 count=1 iflag=direct status=none
          rc=$?
          set -e
          end=$(date +%s)
          if [ "$rc" -eq 0 ]; then
            echo "I/O succeeded against a dead or stale link" >&2
            return 1
          fi
          if [ "$rc" -eq 124 ] || [ $((end - start)) -ge "$limit" ]; then
            echo "I/O stayed blocked for ${limit}s" >&2
            return 1
          fi
        }
        sudo mkdir -p /mnt/roswap-huge
        sudo mount -t tmpfs -o huge=advise,size=128M tmpfs /mnt/roswap-huge
        sudo chmod 777 /mnt/roswap-huge
        ROSWAP_CHUNK_DIR=/mnt/roswap-huge cargo test --offline --lib \
          provider::tests::test_chunk_mr_and_persistence_across_reopen -- --test-threads=1
        start_provider /tmp/roswapd.log
        load_roswap /tmp/roswapd.log
        sudo ./tools/blkcheck /dev/roswap0
        sudo mkswap /dev/roswap0
        sudo swapon /dev/roswap0
        grep -q roswap0 /proc/swaps
        memhold_out=$( (sleep 2; echo quit) | sudo systemd-run --pipe --collect --wait \
          -p MemoryMax=8M -p MemorySwapMax=64M \
          -- "$(pwd)/tools/memhold" -m 24m -i 1 )
        printf '%s\n' "$memhold_out"
        printf '%s\n' "$memhold_out" | grep -q "校验通过"
        if printf '%s\n' "$memhold_out" | grep -q "校验失败"; then
          echo "memhold verify failed" >&2
          exit 1
        fi
        printf '%s\n' "$memhold_out" | grep "交换" | grep -vq "交换 0 B"
        sudo swapoff /dev/roswap0
        echo 1 | sudo tee /sys/module/roswap/parameters/drop_connection >/dev/null
        timeout 30 sudo ./tools/blkcheck /dev/roswap0
        before=$(sudo dmesg | grep -c "connected to" || true)
        stop_provider
        start_provider /tmp/roswapd-restart.log
        reconnected=0
        for _ in $(seq 1 40); do
          now=$(sudo dmesg | grep -c "connected to" || true)
          if [ "$now" -gt "$before" ]; then
            reconnected=1
            break
          fi
          sleep 0.2
        done
        if [ "$reconnected" -ne 1 ]; then
          echo "kernel did not reconnect after provider restart" >&2
          exit 1
        fi
        expect_io_fails_quickly 5
        sudo rmmod roswap
        load_roswap /tmp/roswapd-restart.log
        sudo ./tools/blkcheck /dev/roswap0
        stop_provider
        expect_io_fails_quickly 15