name: roswap.ko

on:
  push:
    branches: [ "master" ]
    paths: &paths
      - 'kernel/**'
      - 'tests/e2e/kernel.config'
      - '.checkpatch.conf'
      - '.github/workflows/kernel.yml'
      - '.github/scripts/apt-install.sh'
      - '.github/scripts/kernel-tree.sh'
  pull_request:
    branches: [ "master" ]
    paths: *paths
  schedule:
    # 新发布的 stable / rc 不用等代码改动就能发现问题。
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Checkpatch
      run: |
        base=https://raw.githubusercontent.com/torvalds/linux/v6.18/scripts
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/checkpatch.pl" "$base/checkpatch.pl"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/spelling.txt" "$base/spelling.txt"
        perl "$RUNNER_TEMP/checkpatch.pl" -f $(git ls-files 'kernel/*.[ch]' ':!kernel/map_user.h')

    - name: Install kernel headers and build tools
      run: bash .github/scripts/apt-install.sh build-essential linux-headers-$(uname -r)

    - name: Build kernel module
      run: make -C kernel KCFLAGS=-Werror

    - name: Map allocator tests
      run: make -C kernel map-test

  # 每个维护中的 LTS 分支、最新 stable 和 mainline rc 各编一次 roswap.ko。
  # 只编译不运行；运行时测试见 e2e.yml 的 vm job。
  compat:
    name: build on ${{ matrix.kernel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        kernel: [ "5.10", "5.15", "6.1", "6.6", "6.12", "6.18", "stable" ]
        include:
          # 5.x 早于 GCC 13，用同代的 GCC 编，避免新编译器在老内核头文件里报出的无关警告。
          - kernel: "5.10"
            cc: "gcc-11"
          - kernel: "5.15"
            cc: "gcc-11"
          - kernel: "mainline"
            experimental: true
    env:
      CC: ${{ matrix.cc || 'gcc' }}

    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: |
        bash .github/scripts/apt-install.sh \
          build-essential "$CC" bc bison flex libelf-dev libssl-dev cpio rsync python3

    - name: Prepare ${{ matrix.kernel }} headers
      id: tree
      run: |
        KMAKE_ARGS="CC=$CC HOSTCC=$CC" \
          bash .github/scripts/kernel-tree.sh prepare "${{ matrix.kernel }}" "$RUNNER_TEMP/linux"

    - name: Build roswap.ko against ${{ steps.tree.outputs.version }}
      run: |
        make -C kernel KDIR="$RUNNER_TEMP/linux" CC="$CC" HOSTCC="$CC" \
          KCFLAGS=-Werror KBUILD_MODPOST_WARN=1
        modinfo kernel/roswap.ko | grep -E '^(vermagic|depends)'
