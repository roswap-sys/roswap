name: e2e

on:
  push:
    branches: [ "master" ]
    paths: &paths
      - 'src/**'
      - 'kernel/**'
      - 'tools/**'
      - 'proto/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [ "master" ]
    paths: *paths
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: e2e on host kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        bash .github/scripts/apt-install.sh \
          build-essential linux-headers-$(uname -r) python3 \
          libibverbs-dev librdmacm-dev protobuf-compiler

    - uses: Swatinem/rust-cache@v2

    - name: Build
      run: |
        make -C kernel
        cargo build --locked --release --bins
        make -C tools

    - name: Setup Soft-RoCE
      run: bash .github/scripts/setup-soft-roce.sh

    - name: Block device
      timeout-minutes: 8
      run: sudo python3 tests/e2e/run.py blk

    - name: Swap
      timeout-minutes: 8
      run: sudo python3 tests/e2e/run.py swap

    - name: Fault injection
      timeout-minutes: 8
      run: sudo python3 tests/e2e/run.py fault

    - name: Module parameters
      timeout-minutes: 8
      run: sudo python3 tests/e2e/run.py params

    - name: Reconnect under IO
      timeout-minutes: 8
      run: sudo python3 tests/e2e/run.py stress

    - name: Illegal netlink
      timeout-minutes: 8
      run: sudo python3 tests/e2e/run.py genl

    - name: Two replicas
      timeout-minutes: 8
      run: sudo python3 tests/e2e/run.py replica2

    - name: Read hedge
      timeout-minutes: 8
      run: sudo python3 tests/e2e/run.py hedge

    - name: Suspect node
      timeout-minutes: 8
      run: sudo python3 tests/e2e/run.py suspect

    - name: Dead node
      timeout-minutes: 8
      run: sudo python3 tests/e2e/run.py dead

    - name: Fault-detection robustness
      timeout-minutes: 8
      run: sudo python3 tests/e2e/run.py robust

    - name: Collect logs
      if: failure()
      run: |
        mkdir -p e2e-logs
        sudo dmesg > e2e-logs/dmesg.txt || true
        if [ -d /tmp/roswap-e2e ]; then
          sudo cp -a /tmp/roswap-e2e/. e2e-logs/
        fi
        sudo chown -R "$(id -u):$(id -g)" e2e-logs

    - name: Upload logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-logs-host
        path: e2e-logs
        if-no-files-found: ignore

  userspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: bash .github/scripts/apt-install.sh libibverbs-dev librdmacm-dev protobuf-compiler

    - uses: Swatinem/rust-cache@v2

    - name: Build
      run: |
        cargo build --locked --release --bins
        make -C tools
        tar -cf userspace.tar target/release/roswapd target/release/roswapctl tools/blkcheck tools/memhold tools/latread

    - uses: actions/upload-artifact@v4
      with:
        name: userspace
        path: userspace.tar
        retention-days: 1

  vm:
    name: e2e on ${{ matrix.kernel }}
    needs: userspace
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(github.event_name == 'pull_request' && '["6.1"]' || '["5.10", "6.1", "6.18", "stable"]') }}
        include:
          - kernel: "5.10"
            cc: "gcc-11"
            vng_args: "--force-initramfs"
          - kernel: "stable"
            experimental: true
    env:
      CC: ${{ matrix.cc || 'gcc' }}
      VNG_ARGS: ${{ matrix.vng_args }}

    steps:
    - uses: actions/checkout@v4

    - name: Set kernel dir
      run: echo "KDIR=$(dirname "$GITHUB_WORKSPACE")/linux-${{ matrix.kernel }}" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: |
        bash .github/scripts/apt-install.sh \
          build-essential "$CC" bc bison flex libelf-dev libssl-dev cpio rsync zstd python3-pip \
          qemu-system-x86 virtiofsd udev kmod busybox-static \
          ibverbs-providers librdmacm1
        sudo pip3 install --break-system-packages virtme-ng==1.42
        if [ -x /usr/bin/gnuenv ]; then sudo ln -sf gnuenv /usr/bin/env; fi

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
          sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm

    - name: Resolve kernel version
      id: version
      run: |
        read -r version url < <(bash .github/scripts/kernel-tree.sh resolve "${{ matrix.kernel }}")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Restore kernel build
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.KDIR }}
        key: vmkernel-${{ steps.version.outputs.version }}-${{ env.CC }}-${{ hashFiles('tests/e2e/kernel.config', '.github/scripts/kernel-tree.sh') }}

    - name: Build kernel ${{ steps.version.outputs.version }}
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        KMAKE_ARGS="CC=$CC HOSTCC=$CC" \
          bash .github/scripts/kernel-tree.sh build "${{ matrix.kernel }}" "$KDIR"
        test -f "$KDIR/.roswap-built"
        du -sh "$KDIR"

    - name: Save kernel build
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.KDIR }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - uses: actions/download-artifact@v4
      with:
        name: userspace

    - name: Build roswap.ko
      run: |
        tar -xf userspace.tar
        make -C kernel KDIR="$KDIR" CC="$CC" HOSTCC="$CC"

    - name: Run e2e in VM
      timeout-minutes: 20
      run: |
        out="$GITHUB_WORKSPACE/e2e-logs"
        mkdir -p "$out"
        cd "$KDIR"
        set +e
        vng --verbose --disable-microvm $VNG_ARGS --user root --cpus 4 --memory 3G \
          --rwdir "$GITHUB_WORKSPACE" \
          --exec "python3 $GITHUB_WORKSPACE/tests/e2e/run.py --vm-out $out" 2>&1 | tee "$out/console.txt"
        vng_rc=${PIPESTATUS[0]}
        set -e
        cat "$out/summary.txt" 2>/dev/null || true
        if [ ! -f "$out/result" ]; then
          echo "::error::vm did not reach run.py (vng exit $vng_rc); see the kernel console above or console.txt"
          exit 1
        fi
        test "$(cat "$out/result")" = 0

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-logs-${{ matrix.kernel }}
        path: e2e-logs
        if-no-files-found: ignore
