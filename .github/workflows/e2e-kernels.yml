name: e2e on kernels

# 在 virtme-ng 虚拟机里用指定版本的内核跑完整的 blk / swap / fault 场景。
# 每个内核要完整编一次，第一次十几分钟，之后走缓存。只在合进 master、每天定时和手动时运行；
# PR 上由 kernel.yml 的多版本编译检查和 e2e.yml 的宿主机测试把关。

on:
  push:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - 'kernel/**'
      - 'tools/**'
      - 'proto/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/e2e/**'
      - '.github/workflows/e2e-kernels.yml'
      - '.github/scripts/apt-install.sh'
      - '.github/scripts/kernel-tree.sh'
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: e2e on ${{ matrix.kernel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        # 最老的 LTS、Debian 12 用的 6.1、最新 LTS，再加最新 stable 提前发现新内核的问题。
        kernel: [ "5.10", "6.1", "6.18", "stable" ]
        include:
          - kernel: "5.10"
            cc: "gcc-11"
          - kernel: "stable"
            experimental: true
    env:
      CC: ${{ matrix.cc || 'gcc' }}
      KDIR: ${{ github.workspace }}/../linux-${{ matrix.kernel }}

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        bash .github/scripts/apt-install.sh \
          build-essential "$CC" bc bison flex libelf-dev libssl-dev cpio rsync zstd python3 python3-pip \
          qemu-system-x86 virtiofsd udev kmod busybox-static \
          libibverbs-dev librdmacm-dev protobuf-compiler
        sudo pip3 install --break-system-packages virtme-ng
        # Ubuntu 打过补丁的 Rust coreutils env 会拒绝通过 virtiofs 执行 guest init。
        if [ -x /usr/bin/gnuenv ]; then sudo ln -sf gnuenv /usr/bin/env; fi

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
          sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm

    - name: Resolve kernel version
      id: version
      run: |
        read -r version url < <(bash .github/scripts/kernel-tree.sh resolve "${{ matrix.kernel }}")
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "内核 $version"

    - name: Restore kernel build
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.KDIR }}
        key: vmkernel-${{ steps.version.outputs.version }}-${{ env.CC }}-${{ hashFiles('tests/e2e/kernel.config', '.github/scripts/kernel-tree.sh') }}

    - name: Build kernel ${{ steps.version.outputs.version }}
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        KMAKE_ARGS="CC=$CC HOSTCC=$CC" \
          bash .github/scripts/kernel-tree.sh build "${{ matrix.kernel }}" "$KDIR"

    # 编完马上存。后面的测试失败也不用重新编内核。
    - name: Save kernel build
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.KDIR }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Build roswap
      run: |
        make -C kernel KDIR="$KDIR" CC="$CC" HOSTCC="$CC"
        cargo build --release --bins
        gcc -O2 -Wall -Wextra -o tools/blkcheck tools/blkcheck.c
        gcc -O2 -Wall -Wextra -o tools/memhold tools/memhold.c

    # --disable-microvm：vng 在 KVM 下默认用 QEMU microvm 机型（virtio-mmio + 精简 ACPI），
    # 老内核起不来。q35 + virtio-pci 所有版本都支持。
    # --verbose 把内核控制台打出来，虚拟机没进到测试脚本时也能看到原因。
    - name: Run e2e in VM
      run: |
        out="$GITHUB_WORKSPACE/e2e-logs"
        rm -rf "$out" && mkdir -p "$out"
        cd "$KDIR"
        set +e
        vng --verbose --disable-microvm --user root --cpus 2 --memory 3G \
          --rwdir "$GITHUB_WORKSPACE" \
          --exec "$GITHUB_WORKSPACE/tests/e2e/vm-run.sh $out" 2>&1 | tee "$out/console.txt"
        vng_rc=${PIPESTATUS[0]}
        set -e
        cat "$out/summary.txt" 2>/dev/null || true
        if [ ! -f "$out/result" ]; then
          echo "::error::虚拟机没有运行到 vm-run.sh（vng 退出码 $vng_rc），内核控制台见上方或 console.txt"
          exit 1
        fi
        test "$(cat "$out/result")" = 0

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-logs-${{ matrix.kernel }}
        path: e2e-logs
        if-no-files-found: ignore
